<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;600&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; width:1200px; height:630px; overflow:hidden; background:#0D0B14; }
  #bg { position:absolute; inset:0; font:14px/18px ui-monospace,Consolas,monospace; white-space:pre; color:#9B84FF; opacity:.22;
    -webkit-mask-image:radial-gradient(ellipse at 70% 40%,#000 0,transparent 72%); mask-image:radial-gradient(ellipse at 70% 40%,#000 0,transparent 72%); }
  .t { position:absolute; left:96px; top:0; bottom:0; display:flex; flex-direction:column; justify-content:center; font-family:"Lexend",sans-serif; color:#EEEBF7; }
  h1 { margin:0; font-size:230px; line-height:1; font-weight:600; letter-spacing:-.05em; }
  h1 i { font-style:normal; color:#FF7A82; }
  p { margin:8px 0 0 10px; font-size:44px; font-weight:300; color:#A29DB5; }
  .u { position:absolute; left:96px; bottom:56px; font:22px ui-monospace,Consolas,monospace; color:#9B84FF; }
</style></head><body>
<div id="bg"></div>
<div class="t"><h1>lrxrn<i>.</i></h1><p>Personal portfolio</p></div>
<div class="u">lrxrn.dev</div>
<script>
  const ramp=' ..::-=+*#', cols=146, rows=36; let s='';
  for(let y=0;y<rows;y++){ for(let x=0;x<cols;x++){ const v=(Math.sin(x*.21)*Math.cos(y*.33)+Math.sin((x+y)*.09)+2)/4; s+=ramp[Math.min(ramp.length-1,Math.floor(v*ramp.length))]; } s+='\n'; }
  document.getElementById('bg').textContent=s;
</script></body></html>
